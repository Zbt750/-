{% extends "base.html" %}
{% block title %}学生管理{% endblock %}
{% block content %}
<h1>👨‍🎓 学生管理</h1>

<div class="card">
    <h3>导入学生（Excel）</h3>
    <p>Excel格式：第一列学号，第二列姓名，第三列班级名称</p>
    <form action="/admin/web/students/import" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>选择Excel文件</label>
            <input type="file" name="file" accept=".xlsx,.xls" required>
        </div>
        <div class="form-group">
            <label>管理员密码</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-success">导入</button>
    </form>
</div>

<div class="card">
    <h3>学生列表</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>学号</th>
                <th>姓名</th>
                <th>班级</th>
            </tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.student_id }}</td>
                <td>{{ s.name }}</td>
                <td>{{ s.class_id }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
