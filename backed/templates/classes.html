{% extends "base.html" %}
{% block title %}班级管理{% endblock %}
{% block content %}
<h1>🏫 班级管理</h1>

<div class="card">
    <h3>添加班级</h3>
    <form action="/admin/web/classes/add" method="POST">
        <div class="form-group">
            <label>班级名称</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>值日地点</label>
            <input type="text" name="duty_location" required>
        </div>
        <div class="form-group">
            <label>开始时间</label>
            <input type="time" name="duty_start_time" required>
        </div>
        <div class="form-group">
            <label>结束时间</label>
            <input type="time" name="duty_end_time" required>
        </div>
        <div class="form-group">
            <label>管理员密码</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">添加</button>
    </form>
</div>

<div class="card">
    <h3>班级列表</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>名称</th>
                <th>地点</th>
                <th>时间段</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for cls in classes %}
            <tr>
                <td>{{ cls.id }}</td>
                <td>{{ cls.name }}</td>
                <td>{{ cls.duty_location }}</td>
                <td>{{ cls.duty_start_time }} - {{ cls.duty_end_time }}</td>
                <td>
                    <form action="/admin/web/classes/delete/{{ cls.id }}" method="POST" style="display:inline;">
                        <input type="hidden" name="password" value="admin123">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('确定删除？')">删除</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
